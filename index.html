<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>IT Support Desk</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <div class="header-title">
            <h1>IT Support Desk</h1>
            <p>Support Ticket Management</p>
        </div>

        <div class="header-button">
            <button id="new-ticket">
                + New Ticket
            </button>
        </div>

    </header>

    <main>

        <!-- Cards -->
        <section>
            <div class="cards-title">
                <h2>Dashboard</h2>
            </div>

            <div class="cards-layout">
                <div class="card">
                    <h3>Open</h3>
                    <p id="open-card"></p>
                </div>

                <div class="card">
                    <h3>In Progress</h3>
                    <p id="progress-card"></p>
                </div>

                <div class="card">
                    <h3>Resolved</h3>
                    <p id="resolved-card"></p>
                </div>
            </div>

        </section>

        <!-- Tickets -->
        <section>
            <div class="tickets-title">
                <h2>Tickets</h2>
            </div>

            <div class="tickets-layout">
                <div class="tickets-search">
                    <input type="text" aria-label="search for tickets" placeholder="Search tickets.." id="search">
                </div>

                <div class="tickets-priority">
                    <select id="priority" aria-label="filters ticket priorities">
                        <option value="all-priorities">All Priorities</option>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                        <option value="Critical">Critical</option>
                    </select>
                </div>

                <div class="tickets-status">
                    <select id="statuses" aria-label="filters ticket statuses">
                        <option value="all-statuses">All Statuses</option>
                        <option value="Open">Open</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Resolved">Resolved</option>
                    </select>
                </div>



            </div>


            <!-- Table -->
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Issue</th>
                        <th>Requester</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>Updated</th>
                    </tr>
                </thead>

                <tbody id="table-body">

                </tbody>

            </table>
        </section>

    </main>


    <dialog id="new-ticket-dialog">
        <form id="new-ticket-form">
            <h2>New Support Ticket</h2>

            <div>
                <label for="ticket-issue">Issue</label>
                <input type="text" id="ticket-issue" required>
            </div>

            <div>
                <label for="ticket-requester">Requester</label>
                <input type="text" id="ticket-requester" required>
            </div>

            <div>
                <label for="ticket-priority">Priority</label>

                <select id="ticket-priority" required>

                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                    <option value="Critical">Critical</option>

                </select>
            </div>

            <div>
                <button type="submit">Create Ticket</button>

                <button type="button" id="cancel-ticket">Cancel</button>
            </div>

        </form>
    </dialog>


    <script src="js/app.js"></script>
</body>

</html>
